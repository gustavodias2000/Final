# Mantém a API (Render gratuita) e o banco (Supabase gratuito) acordados no horário
# de uso. Sem isso, a primeira entrada depois de 15 min parados leva cerca de 30 s,
# e o Supabase pausa o banco depois de 7 dias sem uso.
name: Manter API acordada

on:
  schedule:
    # A cada 10 min, de segunda a sábado, das 10h às 23h50 UTC (7h às 20h50 em Brasília).
    - cron: "*/10 10-23 * * 1-6"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar API e banco
        run: >
          curl --fail --silent --show-error
          --retry 3 --retry-delay 20 --max-time 90
          https://final-iy3j.onrender.com/health/db
